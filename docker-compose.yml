version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-backend
    expose:
      - "5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_ENV=development

  frontend:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-frontend
    ports:
      - "80:80"
    volumes:
      - ./static:/app/static
    depends_on:
      - backend
